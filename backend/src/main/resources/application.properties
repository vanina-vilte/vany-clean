spring.application.name=demo
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaniclean?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.to=${MAIL_TO:vaninasvilte@gmail.com}
# Uno o mas origenes separados por coma (ej: https://vanyclean.com.ar,https://www.vanyclean.com.ar)
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}

# JWT: en produccion SIEMPRE definir JWT_SECRET como variable de entorno (32+ caracteres al azar).
# Este valor por defecto es solo para desarrollo local y NO debe usarse en produccion.
jwt.secret=${JWT_SECRET:dev-only-local-secret-do-not-use-in-production-32}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin maestro: en produccion SIEMPRE definir ADMIN_EMAIL y ADMIN_PASSWORD como variables de entorno
# en el panel del hosting (nunca en este archivo). Se crea una unica vez al arrancar, si no existe.
admin.default.email=${ADMIN_EMAIL:admin@vaniclean.com}
admin.default.password=${ADMIN_PASSWORD:changeme-dev-only}
